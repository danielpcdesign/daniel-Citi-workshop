[pytest]
# backend/ on the path so tests import _shared.router the way the tree is laid out
pythonpath = backend
testpaths = backend
# the lambda-vendored copies and pip-installed packages under backend/<svc>/ are not our tests
norecursedirs = shared _examples .* *.dist-info psycopg* __pycache__
# every service's tests are named test_function.py; importlib mode keeps them from colliding
addopts = --import-mode=importlib --cov --cov-config=.coveragerc --cov-report=term-missing
